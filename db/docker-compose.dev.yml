version: "3.9"

services:
  redis:
    image: redis:8.2.2
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--stop-writes-on-bgsave-error","no", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING" ]
      interval: 2s
      timeout: 1s
      retries: 30
    volumes:
      - ./redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  dav:
    image: ckulka/baikal:nginx
    restart: always
    ports:
      - "127.0.0.1:5232:80"
    volumes:
      - ./init/dav_config:/var/www/baikal/config
      - ./dav_data:/var/www/baikal/Specific

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - ./typesense-data:/data
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY}
      --enable-cors
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY}

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    restart: unless-stopped
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3901:3901"
      - "127.0.0.1:3902:3902"
      - "127.0.0.1:3903:3903"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET}
    volumes:
      - ./init/garage/garage.toml:/etc/garage.toml
      - ./garage/data:/var/lib/garage/data
      - ./garage/meta:/var/lib/garage/meta
    command: >
      /garage server
      --single-node
      --default-bucket  

  baikal-postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: baikal
      POSTGRES_PASSWORD: ${BAIKAL_POSTGRES_PASSWORD:-strong_baikal_password}
      POSTGRES_DB: baikal
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./baikal-data:/var/lib/postgresql
      - ./init/baikal-init:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=100
      -c work_mem=4MB

  postgres:
    image: postgres:18-bookworm
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data:/var/lib/postgresql
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c work_mem=4MB

  migrate:
    image: postgres:18-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_RLS_URL: ${DATABASE_RLS_URL:-}
      RLS_CLIENT_USER: ${RLS_CLIENT_USER:-}
      RLS_CLIENT_PASSWORD: ${RLS_CLIENT_PASSWORD:-}
    volumes:
      - ./init:/scripts
    entrypoint: [ "/bin/bash", "/scripts/db-bootstrap.sh" ]
    restart: "no"
