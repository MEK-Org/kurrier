# Workflow Template: Safe Upstream Main Sync
# NOTE: This file is a reference template provided under scripts/workflows/.
# GitHub Actions only registers schedule and workflow_dispatch events from .github/workflows/
# on the repository's default branch. Because MEK-Org/kurrier preserves main as a clean
# upstream mirror (with no fork-specific workflow files) and the default branch is currently main,
# this workflow is not active as automated CI.
# To activate in GitHub Actions:
#   1. Set mek as the repository default branch (requires repository Admin permissions).
#   2. Copy this file to .github/workflows/sync-upstream.yml (requires workflow PAT scope).
# For on-demand sync, run scripts/sync-upstream.sh directly.

name: Sync Upstream Main

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify divergence without pushing updates to main'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-upstream:
    name: Sync Upstream Main & Check Divergence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run safe sync script
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/sync-upstream.sh
          ./scripts/sync-upstream.sh
